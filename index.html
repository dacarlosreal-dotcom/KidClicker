<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kid Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#6ec1ff;--sky2:#e6f7ff;--g1:#7ed957;--g2:#47b84f;--ink:#2b3a55;--shop:#fff8ec;--card:#fff;--cb:#ffd9a8;--ok:#2fbf71;--h1:#ff8a65;--h2:#ff6f91;--wood:#a8672b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#141c42;--sky2:#34457f;--g1:#2f6b45;--g2:#245536;--ink:#f1f3ff;--shop:#232a3f;--card:#2d3550;--cb:#47507a;--ok:#4fd88f}}
:root[data-theme="dark"]{--sky1:#141c42;--sky2:#34457f;--g1:#2f6b45;--g2:#245536;--ink:#f1f3ff;--shop:#232a3f;--card:#2d3550;--cb:#47507a;--ok:#4fd88f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;font-family:'Fredoka','Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);overflow:hidden}
button,input{font-family:inherit}
#zone{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;
background:radial-gradient(ellipse 70% 110px at 20% 100%,var(--g1) 98%,transparent 100%),radial-gradient(ellipse 60% 150px at 85% 100%,color-mix(in srgb,var(--g1),#fff 15%) 98%,transparent 100%),linear-gradient(to top,var(--g2) 0,var(--g2) 56px,transparent 57px),radial-gradient(circle at 88% 12%,#fff6b0 0 26px,rgba(255,240,150,.5) 27px,transparent 110px)}
#zone::before,#zone::after{content:'☁️';position:absolute;z-index:-1;font-size:5rem;opacity:.85;left:-15%;top:6%;animation:drift 60s linear infinite;pointer-events:none}
#zone::after{top:26%;font-size:3.4rem;opacity:.6;animation-duration:90s;animation-delay:-45s}
@keyframes drift{to{left:110%}}
#zone[data-bg=beach]{background:linear-gradient(to top,#f3d58a 0,#f3d58a 56px,transparent 57px),linear-gradient(to top,transparent 56px,#1e9ad6 57px,#5fd0f7 118px,transparent 119px),radial-gradient(circle at 14% 14%,#fff3b0 0 28px,rgba(255,230,120,.5) 29px,transparent 110px),linear-gradient(180deg,#7fd3ff,#e9faff 75%)}
#zone[data-bg=candy]{background:repeating-linear-gradient(90deg,#ff7fba 0 24px,#ffb6d9 24px 48px) left bottom/100% 56px no-repeat,radial-gradient(ellipse 60% 120px at 15% 100%,#ffd0e8 98%,transparent 100%),radial-gradient(ellipse 55% 150px at 88% 100%,#c8f5e4 98%,transparent 100%),linear-gradient(180deg,#b79bff,#ffc8ec)}
#zone[data-bg=space]{background:linear-gradient(to top,#4b5066 0,#7b8199 50px,transparent 51px),radial-gradient(circle 60px at 82% 22%,#ff9966 0 62%,#d9643a 63% 90%,transparent 100%),radial-gradient(2px 2px at 20% 25%,#fff,transparent),radial-gradient(2px 2px at 75% 12%,#fff,transparent),radial-gradient(2px 2px at 55% 55%,#fff,transparent),radial-gradient(2px 2px at 35% 70%,#fff,transparent),linear-gradient(180deg,#0b1030,#2a1b5e)}
#zone[data-bg=ocean]{background:linear-gradient(to top,#e8c98b 0,#e8c98b 40px,transparent 41px),radial-gradient(ellipse 45% 70px at 20% 100%,#f1d9a0 98%,transparent 100%),linear-gradient(180deg,#4dd0e1,#0277bd)}
#zone[data-bg=rainbow]{background:linear-gradient(to top,#b5ffb0 0,#b5ffb0 40px,transparent 41px),radial-gradient(circle at 50% 118%,transparent 0 52%,#ff6b6b 52% 56%,#ffd93d 56% 60%,#6bcb77 60% 64%,#4d96ff 64% 68%,#b983ff 68% 72%,transparent 72%),linear-gradient(180deg,#ff9a9e,#fecfef 35%,#a1c4fd 70%,#c2ffd8)}
#scene{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:space-around;align-items:flex-end;font-size:clamp(1.6rem,4vw,2.6rem);pointer-events:none;z-index:-1;white-space:nowrap}
#scene i{font-style:normal;animation:sway 4s ease-in-out infinite;transform-origin:bottom}
#scene i:nth-child(2n){animation-delay:-1.5s}
@keyframes sway{50%{transform:rotate(4deg)}}
.name{background:rgba(255,255,255,.88);color:#2b3a55;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.12);font-weight:600;margin-bottom:10px;text-align:center}
.name button{margin-left:8px;font-size:.75rem;cursor:pointer;border:0;background:var(--h2);color:#fff;border-radius:8px;padding:2px 10px}
h1{margin:0;font-size:clamp(1.8rem,5.5vw,3.2rem);color:#fff;text-align:center;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.2);padding:4px 28px;border-radius:28px;backdrop-filter:blur(4px);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.kps{background:rgba(0,0,0,.25);color:#fff;padding:4px 14px;border-radius:999px;font-weight:600;margin:10px 10px 18px;text-align:center;font-size:.9rem}
#kid{display:grid;place-items:center;width:clamp(100px,min(30vw,28vh),230px);aspect-ratio:1;border-radius:50%;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:clamp(4rem,14vw,7rem);background:radial-gradient(circle at 35% 30%,#fff7d6,#ffd36b 60%,#ffb347);border:6px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.15),0 0 0 10px rgba(255,255,255,.35);animation:idle 3s ease-in-out infinite,glow 2.5s ease-in-out infinite;transition:scale .08s}
@keyframes idle{50%{translate:0 -8px}}
@keyframes glow{50%{box-shadow:0 10px 0 rgba(0,0,0,.15),0 0 0 14px rgba(255,255,255,.5),0 0 40px rgba(255,220,120,.8)}}
#kid:hover{scale:1.04}#kid:active,#kid.tap{scale:.92}
.tools{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px;z-index:3}#zone{padding-bottom:72px}
.tools button{border:0;background:#fff;color:#2b3a55;box-shadow:0 4px 0 rgba(0,0,0,.15);border-radius:12px;font-weight:600;padding:8px 14px;cursor:pointer;transition:transform .1s}
.tools button:hover{transform:translateY(-2px)}.tools button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
#grad{background:linear-gradient(90deg,#f6d365,#fda085)!important}#grad:disabled{opacity:.5;cursor:not-allowed}
.float{position:absolute;color:#fff;font-weight:700;font-size:1.7rem;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:-1px -1px 0 var(--h2),1px -1px 0 var(--h2),-1px 1px 0 var(--h2),1px 1px 0 var(--h2)}
@keyframes up{to{opacity:0;transform:translateY(-110px) scale(1.2)}}
#bus{position:absolute;font-size:3.5rem;cursor:pointer;animation:bob 1s ease-in-out infinite;z-index:5;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-8px)}}
#shop{width:360px;margin:10px 10px 10px 0;border:8px solid var(--wood);border-radius:18px;background:var(--shop);box-shadow:inset 0 0 0 4px #e0a96d,0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#shop::before,#shop::after{content:'';display:block;flex:none;height:22px;background:linear-gradient(var(--wood),var(--wood)) 0 13px/100% 4px no-repeat,repeating-linear-gradient(90deg,#e8b87a 0 12px,#c98d4f 12px 14px,transparent 14px 18px)}
#shop h2{margin:0;padding:12px;text-align:center;font-size:1.5rem;color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.2);background:linear-gradient(90deg,var(--h1),var(--h2),var(--h1));background-size:200% 100%;animation:shimmer 6s linear infinite}
#shop h2::before{content:'🧸 '}
@keyframes shimmer{to{background-position:200% 0}}
#items{flex:1;overflow-y:auto;padding:12px}
#items::-webkit-scrollbar{width:10px}#items::-webkit-scrollbar-thumb{background:var(--cb);border-radius:10px}
.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--h2);font-weight:700;display:flex;align-items:center;gap:8px;margin:10px 0}
.sec::after{content:'';flex:1;height:3px;border-radius:3px;background:var(--cb)}
.card{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;margin-bottom:10px;border-radius:16px;cursor:pointer;color:var(--ink);border:3px solid var(--cb);box-shadow:0 4px 0 var(--cb);transition:transform .12s;
background:linear-gradient(90deg,color-mix(in srgb,var(--ok),transparent 78%) var(--p,0%),var(--card) var(--p,0%))}
.card:not(.off){border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.card:hover{transform:translateY(-2px) scale(1.01)}.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cb)}
.card.off{filter:grayscale(.5);opacity:.65}
.card h3{margin:0 0 3px;font-size:1rem;font-weight:600}.card p{margin:0;font-size:.8rem;opacity:.7}
.cnt{background:var(--h2);color:#fff;padding:1px 8px;border-radius:20px;font-size:.75rem;margin-left:6px}
.cost{background:var(--ok);color:#fff;padding:4px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
.cost::before{content:'👦 ';font-size:.8em}.card.off .cost{background:#9aa3b5}.cost.own{background:var(--h1)}.cost.own::before{content:''}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000}
.box{background:var(--shop);color:var(--ink);border:6px solid #ffd36b;border-radius:24px;padding:22px;width:min(92%,440px);max-height:86%;overflow-y:auto;text-align:center;animation:pop .25s ease-out;box-shadow:0 12px 0 rgba(0,0,0,.2)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.box h2{margin:0 0 12px}
.box input[type=text]{width:100%;padding:10px;font-size:1.1rem;margin:8px 0 14px;border-radius:10px;border:2px solid var(--cb);background:var(--card);color:var(--ink)}
.pbtn{padding:10px 24px;font-size:1rem;border:0;border-radius:12px;background:var(--h2);color:#fff;cursor:pointer;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#setm .box{text-align:left;padding-top:0}
#setm h2{position:relative;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;margin:0 -22px 12px;padding:14px;border-radius:16px 16px 0 0;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.2)}
#setX{position:absolute;top:50%;right:12px;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#d63031;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#tabs button,.opt{flex:1 1 22%;padding:8px 4px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--cb);font-size:.85rem}
#tabs button.sel,.opt.sel{background:var(--ok);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.row{display:flex;gap:6px;margin-bottom:10px}
.ach{font-size:.82rem;padding:6px 10px;margin-bottom:5px;border-radius:10px;background:rgba(255,190,110,.18);opacity:.8}.ach.got{background:rgba(47,191,113,.2);opacity:1}
.bar{height:6px;border-radius:6px;background:rgba(0,0,0,.14);margin-top:4px}.bar i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.vol{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600}.vol input{flex:1;accent-color:var(--h2)}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffd54f,#ffb300);color:#4a3200;font-weight:700;padding:8px 18px;border-radius:20px;z-index:1010;display:none;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:center;max-width:90%}
.conf{position:fixed;top:-30px;z-index:1020;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
#dev{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:none;width:200px;padding:10px;border-radius:16px;background:linear-gradient(160deg,#0b2a66,#123f8f);border:2px solid #5aa9ff;color:#e8f2ff;box-shadow:0 8px 0 rgba(0,20,60,.5)}
#dev input{width:100%;padding:5px;margin:6px 0;border-radius:6px;border:0}
#dev button{width:100%;margin-top:5px;padding:6px;border:0;border-radius:8px;cursor:pointer;color:#fff;font-weight:700;background:linear-gradient(#6db6ff,#2f7de1)}
#zone[data-bg=farm]{background:linear-gradient(to top,#8bc34a 0,#8bc34a 56px,transparent 57px),radial-gradient(ellipse 60% 100px at 25% 100%,#a5d86a 98%,transparent 100%),radial-gradient(circle at 85% 14%,#fff3b0 0 26px,rgba(255,240,150,.5) 27px,transparent 100px),linear-gradient(180deg,#87ceeb,#f1fbff)}
#zone[data-bg=snow]{background:linear-gradient(to top,#fff 0,#eef6ff 56px,transparent 57px),radial-gradient(ellipse 60% 130px at 20% 100%,#dbeafe 98%,transparent 100%),radial-gradient(ellipse 50% 170px at 85% 100%,#c7dcf5 98%,transparent 100%),radial-gradient(2px 2px at 25% 20%,#fff,transparent),radial-gradient(2px 2px at 65% 35%,#fff,transparent),linear-gradient(180deg,#9fc5e8,#eaf4ff)}
#zone[data-bg=jungle]{background:linear-gradient(to top,#2e7d32 0,#2e7d32 56px,transparent 57px),radial-gradient(ellipse 60% 120px at 15% 100%,#388e3c 98%,transparent 100%),radial-gradient(ellipse 50% 160px at 85% 100%,#43a047 98%,transparent 100%),linear-gradient(180deg,#76c893,#d9f99d)}
#zone[data-bg=castle]{background:linear-gradient(to top,#9be58f 0,#9be58f 50px,transparent 51px),radial-gradient(ellipse 50% 110px at 80% 100%,#b6f0a8 98%,transparent 100%),radial-gradient(circle at 15% 15%,#fff 0 20px,rgba(255,255,255,.4) 21px,transparent 90px),linear-gradient(180deg,#d9a7ff,#ffe3f1)}
#zone[data-bg=night]{background:linear-gradient(to top,#2b2f45 0,#2b2f45 44px,transparent 45px),radial-gradient(2px 2px at 20% 20%,#fff,transparent),radial-gradient(2px 2px at 70% 12%,#fff,transparent),radial-gradient(2px 2px at 45% 40%,#fff,transparent),radial-gradient(circle 34px at 82% 20%,#fff6c2 0 70%,transparent 72%),linear-gradient(180deg,#0f1535,#3a2f6b)}
#zone[data-bg=beach]::before{content:'☀️'}#zone[data-bg=beach]::after{content:'🕊️'}
#zone[data-bg=candy]::before{content:'🍭'}#zone[data-bg=candy]::after{content:'🍬'}
#zone[data-bg=space]::before{content:'🚀'}#zone[data-bg=space]::after{content:'🛸'}
#zone[data-bg=ocean]::before{content:'🐠'}#zone[data-bg=ocean]::after{content:'🐙'}
#zone[data-bg=rainbow]::before{content:'🌈'}#zone[data-bg=rainbow]::after{content:'🦄'}
#zone[data-bg=farm]::after{content:'🐦'}
#zone[data-bg=snow]::before{content:'❄️'}#zone[data-bg=snow]::after{content:'❄️'}
#zone[data-bg=jungle]::before{content:'🦜'}#zone[data-bg=jungle]::after{content:'🦋'}
#zone[data-bg=castle]::after{content:'🐉'}
#zone[data-bg=night]::before{content:'🌠'}#zone[data-bg=night]::after{content:'🦇'}
#qty{display:flex;gap:6px;padding:10px 12px 0}
#qty button{flex:1;border:0;border-radius:10px;padding:6px 0;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--cb);transition:transform .1s}
#qty button.sel{background:var(--ok);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}#qty button:active{transform:translateY(2px)}
.stats{font-size:.78rem;font-weight:600;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);margin:-8px 8px 14px;text-align:center}
#campus{position:absolute;left:8px;right:8px;bottom:64px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:clamp(1.2rem,3vw,1.9rem);z-index:1;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
#campus i{font-style:normal;animation:hop 2.4s ease-in-out infinite}#campus i:nth-child(2n){animation-delay:-.8s}#campus i:nth-child(3n){animation-delay:-1.6s}
@keyframes hop{50%{transform:translateY(-6px)}}
.spark{position:fixed;pointer-events:none;z-index:30;font-size:1.1rem;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(120deg);opacity:0}}
.card[data-tier="1"] .cnt{background:#3b82f6}.card[data-tier="2"] .cnt{background:#8b5cf6}
.card[data-tier="3"] .cnt{background:linear-gradient(135deg,#ffd54f,#ff9800);color:#4a3200}.card[data-tier="3"]{box-shadow:0 4px 0 #ffb300}
.sec{position:sticky;top:-12px;z-index:2;background:var(--shop);padding:6px 0}
.box::-webkit-scrollbar{width:10px}.box::-webkit-scrollbar-thumb{background:var(--cb);border-radius:10px}
@media (max-width:700px){#campus,.stats{display:none}}
#candy{position:absolute;font-size:3rem;cursor:pointer;z-index:5;animation:bob 1s ease-in-out infinite,spin 6s linear infinite;filter:drop-shadow(0 0 12px gold)}
@keyframes spin{to{rotate:360deg}}
#buff{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:none;z-index:4;white-space:pre;background:linear-gradient(135deg,#ff9a9e,#fad0c4);color:#5a1d2c;font-weight:700;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:.9rem;animation:glow2 1.2s ease-in-out infinite}
@keyframes glow2{50%{box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 18px #ffb6c1}}
#news{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;font-size:.8rem;font-weight:600;color:#fff;background:rgba(0,0,0,.25);padding:3px 14px;border-radius:999px;opacity:0;animation:newsf 12s ease-in-out;pointer-events:none}
@keyframes newsf{0%{opacity:0}8%,88%{opacity:1}100%{opacity:0}}
@media (max-width:700px),(max-height:640px){#news{display:none}}
#kid{position:relative}
#kid::after{content:attr(data-hat);position:absolute;top:-6%;left:50%;transform:translateX(-50%) rotate(-10deg);font-size:.38em;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
#kid:focus-visible{outline:4px solid #fff;outline-offset:6px}
.stats{max-width:92%;line-height:1.4}
#news{left:12px;transform:none;max-width:36%}
.card.lk{filter:grayscale(1);opacity:.55;cursor:not-allowed}.card.lk h3,.card.lk p{filter:blur(5px)}.card.lk:hover{transform:none}
@media (max-width:700px){#tabs button{flex:1 1 30%}.tools button{padding:6px 9px}}
#dev b{display:block;text-align:center;font-size:1.3rem;line-height:1;color:#9fd0ff;cursor:grab;touch-action:none;user-select:none}
#dev b:active{cursor:grabbing}#dev.min{width:auto!important;padding:6px 12px}
@media (max-width:700px){body{flex-direction:column}#shop{width:auto;margin:0 8px 8px;height:50%;flex:none}h1{padding:2px 18px}.kps{margin:6px 8px 12px;font-size:.8rem}.name{margin-bottom:6px}.tools button{padding:6px 10px;font-size:.85rem}.card{padding:8px}#dev{width:150px;font-size:.75rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head>
<body>
<div id="zone">
 <div id="scene"></div><div id="campus"></div><div id="buff"></div><div id="news"></div>
 <div class="name"><span id="nameTxt"></span><button id="renameBtn">Rename</button></div>
 <h1 id="kids">0 Kids</h1>
 <div class="kps" id="kps"></div><div class="stats" id="stats"></div>
 <div id="kid" role="button" aria-label="Click for kids">👦</div>
 <div class="tools"><button id="grad">🎓 Graduate</button><button id="sndBtn">🔊</button><button id="musBtn">🎵 On</button><button id="setBtn">⚙️ Settings</button></div>
</div>
<div id="shop"><h2>The Nursery Shop</h2><div id="qty"></div><div id="items"></div></div>
<div id="toast"></div>
<div class="modal" id="setm"><div class="box"><h2>⚙️ Settings<button id="setX" aria-label="Close">✕</button></h2><div id="tabs"></div><div id="pane"></div><button class="pbtn" id="setDone" style="width:100%;margin-top:8px">Done</button></div></div>
<div class="modal" id="modal" style="display:flex"><div class="box"><h2>🏫 Name your kindergarten</h2><input type="text" id="nameIn" maxlength="24" placeholder="Sunshine Kindergarten"><button class="pbtn" id="nameOk">Open the doors</button></div></div>
<div id="dev"><b title="Drag me · tap to minimize">🤫</b><input id="devAmt" type="number" placeholder="Set kids to..."><button id="devSet">Set kids</button><button id="devBuy">Buy everything +100 (costs kids)</button><button id="devMult">2× production: OFF</button></div>
<script>
const $=id=>document.getElementById(id);
const BUILD=[

function fmt(n){
  if(!isFinite(n)||n<0)n=0;
  n=Math.floor(n);if(n<1000)return String(n);
  let i=Math.floor(Math.log10(n)/3);
  if(i>=SUF.length)return n.toExponential(2).replace('e+','e');
  let v=+(n/Math.pow(1000,i)).toFixed(2);
  if(v>=1000&&i+1<SUF.length){v=1;i++}
  return v+SUF[i];
}

function card(id,icon,title,desc){

function buildShop(){

  it.insertAdjacentHTML('beforeend','<div class="sec" id="secB">Buildings</div>');
  BUILD.forEach(x=>{const e=card(x.id,x.e,x.n,'');e.onclick=()=>buy('b',x);it.appendChild(e)});

let qty=1;
function quote(t,x){
  const g=t==='b'?1.15:x.g,c0=S[t][x.id],disc=t==='b'?discM():1,first=x.base*Math.pow(g,c0)*disc;
  const lim=x.max?x.max-c0:Infinity;if(lim<=0)return{k:0,cost:0,full:1};
  let k=qty==='max'?Math.floor(Math.log(1+S.kids*(g-1)/first)/Math.log(g)):qty;
  k=Math.max(1,Math.min(k,lim,10000));
  return{k,cost:Math.floor(first*(Math.pow(g,k)-1)/(g-1))};
}
function buildQty(){
  const q=$('qty');q.innerHTML='';
  [1,10,100,'max'].forEach(v=>{const b=document.createElement('button');b.textContent=v==='max'?'Max':'×'+v;if(qty===v)b.className='sel';b.onclick=()=>{qty=v;buildQty();render()};q.appendChild(b)});
}
function buy(t,x){
  const q=quote(t,x);
  if(q.full||S.kids<q.cost||$('c-'+x.id).classList.contains('lk'))return;
  S.kids-=q.cost;S[t][x.id]+=q.k;beep(700,.08);render();save();
}

function burst(x,y,c){
  const n=c?8:4,em=c?['💥','⭐','✨']:['✨','⭐'];
  for(let i=0;i<n;i++){
    const e=document.createElement('div'),a=Math.random()*6.28,d=40+Math.random()*50;
    e.className='spark';e.textContent=em[i%em.length];e.style.left=x+'px';e.style.top=y+'px';
    e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(e);setTimeout(()=>e.remove(),700);
  }
}
function tfmt(t){
  if(!isFinite(t)||t>8.6e6)return '99d+';
  t=Math.max(1,Math.ceil(t));
  if(t<60)return t+'s';
  if(t<3600)return Math.floor(t/60)+'m '+(t%60)+'s';
  if(t<86400)return Math.floor(t/3600)+'h '+Math.floor(t%3600/60)+'m';
  return Math.floor(t/86400)+'d '+Math.floor(t%86400/3600)+'h';
}

let actx;
function tone(f,d,v){
  if(!S.snd)return;
  try{
    const a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(Math.max(v*S.svol*2,.0001),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const beep=(f,d)=>tone(f,d,.05);
function tone2(type,f0,f1,d,v,delay){
  const a=ctx(),t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(Math.max(v*S.svol*2,.0001),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,freq){
  const a=ctx(),b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  f.type='bandpass';f.frequency.value=freq;g.gain.value=v*S.svol*2;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}
function clickSound(){
  if(!S.snd)return;
  try{
    const r=Math.random();
    switch(S.ch){
      case 'hero':tone2('sawtooth',300,900,.14,.05);break;
      case 'wizard':[880,1175,1568].forEach((f,i)=>tone2('sine',f*(1+r*.05),f*1.02,.12,.07,i*.05));break;
      case 'ninja':noise(.09,.3,3500+r*1500);break;
      case 'astro':tone2('sine',1300,420,.16,.08);break;
      case 'mermaid':tone2('sine',400+r*200,1000+r*300,.09,.09);tone2('sine',500+r*200,1200,.09,.07,.08);break;
      case 'unicorn':[1319,1760,2093].forEach((f,i)=>tone2('sine',f,f*1.02,.14,.05,i*.04));break;
      case 'dragon':tone2('sawtooth',150+r*30,55,.28,.07);noise(.2,.1,300);break;
      default:{const f=450+r*250;tone2('triangle',f,f*1.01,.05,.05)}
    }
  }catch(e){}
}

let mTimer=null,mStep=0,mGain=null,mOut=null;
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicInit(){
  const a=ctx();if(mGain)return;
  mOut=a.createGain();mOut.gain.value=S.mvol*1.4;mOut.connect(a.destination);
  mGain=a.createGain();mGain.gain.value=.5;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
  const dl=a.createDelay(1),fb=a.createGain();dl.delayTime.value=.43;fb.gain.value=.35;dl.connect(fb);fb.connect(dl);
  mGain.connect(lp);lp.connect(mOut);lp.connect(dl);dl.connect(mOut);
}
function mDrum(t,kind){
  const a=actx;
  if(kind==='k'){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(mOut);o.start(t);o.stop(t+.2);return}
  const d=kind==='s'?.14:.04,b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);
  const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;g.gain.value=kind==='s'?.09:.05;
  src.buffer=b;src.connect(f);f.connect(g);g.connect(mOut);src.start(t);
}
function mNote(freq,t,d,v,type,atk){
  const o=actx.createOscillator(),g=actx.createGain(),a=atk||.08,e=t+Math.max(d,a+.05);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,e);
  o.connect(g);g.connect(mGain);o.start(t);o.stop(e+.05);
}
function musicStep(){
  if(!S.music||!actx||actx.state!=='running')return;
  const M=MOODS.find(m=>m.id===S.mood)||MOODS[0],t=actx.currentTime+.05,b=M.beat,chord=M.prog[Math.floor(mStep/4)%M.prog.length],s=mStep%4;
  if(M.arp){const n=chord[mStep%chord.length];mNote(mf(n),t,b*3,.07,'sine',.01);mNote(mf(n+12),t,b*1.2,.03,'sine',.01);if(s===0)mNote(mf(chord[0]-12),t,b*3,.05,'sine')}
  else if(s===0){chord.forEach((n,i)=>mNote(mf(n),t+i*(M.stag||0),b*4,M.pv,M.type,M.atk));mNote(mf(chord[0]-12),t,b*3.5,.06,'sine')}
  if(M.drums){mDrum(t,s%2===0?'k':'s');mDrum(t+b/2,'h')}
  if(Math.random()<M.mp)mNote(mf(M.mel[Math.random()*M.mel.length|0]),t+(Math.random()<.3?b/2:0),b*1.6,.04,'sine');
  mStep++;
}
function musicOn(){
  if(!S.music)return;musicInit();if(mTimer)return;
  const M=MOODS.find(m=>m.id===S.mood)||MOODS[0];
  mTimer=setInterval(musicStep,Math.round(M.beat*1000));musicStep();
}

  if(innerWidth<=700)toggleDev();
})();

// ----- save / load (reads your old save slot 1, so progress carries over) -----
function save(){try{S.last=Date.now();localStorage.setItem(slotKey(slot),JSON.stringify(S))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot))||'null');if(!d)return;
    ['name'].forEach(k=>S[k]=d[k]||'');
    ['kids','total','dip','bus','clicks','last'].forEach(k=>{const v=+d[k];S[k]=isFinite(v)&&v>0?v:0});
    S.ach=d.ach||{};S.bgs=d.bgs||{meadow:1};S.bg=BGS.some(x=>x.id===d.bg)?d.bg:'meadow';
    S.chars=d.chars||{mix:1};S.ch=CHARS.some(x=>x.id===d.ch)?d.ch:'mix';
    S.music=d.music!==false;S.mood=MOODS.some(x=>x.id===d.mood)?d.mood:'chill';S.mvol=d.mvol!=null?+d.mvol:.7;S.svol=d.svol!=null?+d.svol:.5;S.cur=d.cur||'def';S.pname=d.pname||'';S.best=+d.best||0;S.candy=+d.candy||0;S.perks=d.perks||{};S.dspent=+d.dspent||0;S.peak=+d.peak||0;S.theme=d.theme||'auto';S.snd=d.snd!==false;S.auto=!!d.auto;
    BUILD.forEach(x=>S.b[x.id]=Math.max(0,+(d.b&&d.b[x.id])||0));
    UPG.forEach(x=>S.u[x.id]=Math.max(0,+(d.u&&d.u[x.id])||0));
  }catch(e){}
}
setInterval(save,2000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);

// ----- cursors -----
const CURS=[['def','Default','🖱️',''],['hand','Pointing Hand','👆','pointer'],['cross','Crosshair','➕','crosshair'],['apple','Teacher Apple','🍎',0],['star','Gold Star','⭐',0],['crayon','Crayon','🖍️',0],['wand','Magic Wand','🪄',0],['rocket','Rocket','🚀',0],['lolly','Lollipop','🍭',0]].map(([id,n,e,css])=>({id,n,e,css}));
function applyCursor(){
  let st=$('curStyle');if(!st){st=document.createElement('style');st.id='curStyle';document.head.appendChild(st)}
  const c=CURS.find(x=>x.id===S.cur)||CURS[0];let css=c.css;
  if(c.css===0){const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text x='2' y='26' font-size='26'>${c.e}</text></svg>`;css=`url("data:image/svg+xml,${encodeURIComponent(svg)}") 6 6, auto`}
  st.textContent=css?`html,body,*{cursor:${css}!important}`:'';
}
function renderCur(p){
  p.innerHTML='<div class="sec">Pick a cursor (all free)</div>';
  CURS.forEach(x=>{const on=S.cur===x.id;p.appendChild(listCard(x.e+' '+x.n,on?'Equipped':'Tap to use',on?'✔ On':'Free',1,()=>{S.cur=x.id;applyCursor();renderSet();save()}))});
}
// ----- 3 save slots -----
function freshAll(){
  Object.assign(S,{name:'',kids:0,total:0,dip:0,bus:0,clicks:0,ach:{},bgs:{meadow:1},bg:'meadow',chars:{mix:1},ch:'mix',pname:'',best:0,candy:0,perks:{},dspent:0,peak:0,auto:false,last:0});fresh();
}
function switchSlot(n){
  save();slot=n;try{localStorage.setItem('kc_active',n)}catch(e){}
  freshAll();load();applyLook();applyName();if(!S.name)askName();
}
function delSlot(n){
  try{localStorage.removeItem(slotKey(n))}catch(e){}
  if(n===slot){freshAll();applyLook();askName();applyName()}
}
function renderSlots(p){
  p.innerHTML='<div class="sec">3 save slots</div>';
  for(let n=1;n<=3;n++){
    let d=null;try{d=JSON.parse(localStorage.getItem(slotKey(n))||'null')}catch(e){}
    const cur=n===slot,info=cur?S:d,el=document.createElement('div'),row=document.createElement('div');
    el.className='card';el.style.cssText='flex-wrap:wrap;cursor:default';row.style.cssText='display:flex;gap:6px;flex-wrap:wrap;width:100%';
    const nm=document.createElement('div');
    nm.innerHTML=`<h3>💾 Save ${n}${cur?' · active':''}</h3><p></p>`;
    nm.querySelector('p').textContent=info?(info.name||'Unnamed')+' · '+fmt(info.kids||0)+' kids':'Empty';
    el.appendChild(nm);
    const addB=(label,fn,confirm)=>{
      const key=n+label,b=document.createElement('button');b.className='pbtn';b.style.padding='6px 12px';b.textContent=armed===key?'Sure?':label;
      b.onclick=e=>{e.stopPropagation();
        if(confirm&&armed!==key){armed=key;setTimeout(()=>{if(armed===key){armed='';renderSet()}},3000);return renderSet()}
        armed='';fn();renderSet()};
      row.appendChild(b);
    };
    if(cur)addB('Save now',()=>{save();toast('💾 Saved')});
    else{addB(d?'Switch':'Start new',()=>switchSlot(n));addB('Overwrite',()=>{try{localStorage.setItem(slotKey(n),JSON.stringify(S));toast('Copied to save '+n)}catch(e){}},true)}
    if(info)addB('Delete',()=>delSlot(n),true);
    el.appendChild(row);p.appendChild(el);
  }
}
// ----- leaderboard (works on the published page for signed-in viewers) -----
let DB=null,myId=null,BOARD=[];
const nkey=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'');
function badName(n){
  if(n.length<3||n.length>16)return 'Use 3–16 characters.';
  if(!/^[A-Za-z0-9][A-Za-z0-9 .'-]*$/.test(n))return 'Letters, numbers and spaces only.';
  if(profane(n))return 'Please pick a friendlier name.';
  return '';
}
async function pushScore(){
  if(!DB||!myId||!S.pname)return;
  S.best=Math.max(S.best||0,S.total);
  await DB.collection('lb').doc(myId).set({name:S.pname,key:nkey(S.pname),kids:S.best,t:Date.now()});
}
async function claimName(raw){
  const name=raw.trim().replace(/\s+/g,' '),e=badName(name);
  if(e)return e;
  if(!DB||!myId)return 'The leaderboard only works on the online page.';
  try{
    const q=await DB.collection('lb').where('key','==',nkey(name)).get();
    if(q.docs.some(d=>d.id!==myId))return 'That name is already taken.';
    S.pname=name;await pushScore();save();return '';
  }catch(err){return 'Could not reach the leaderboard (you may need contributor access).'}
}
async function boardRefresh(){
  if(DB){try{await pushScore();const q=await DB.collection('lb').orderBy('kids','desc').limit(10).get();BOARD=q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}}
  drawBoard();
}
function drawBoard(){
  const l=$('boardList');if(!l)return;l.innerHTML='';
  if(!DB){l.textContent='The leaderboard works on the online page for signed-in viewers with contributor access.';return}
  if(!BOARD.length){l.textContent='No scores yet. Pick a name and keep clicking!';return}
  BOARD.forEach((r,i)=>l.appendChild(listCard((['🥇','🥈','🥉'][i]||'#'+(i+1))+' '+r.name+(r.id===myId?' (you)':''),'',fmt(r.kids),1,()=>{})));
}
function renderBoardPane(p){
  p.innerHTML='<div class="sec">Your leaderboard name</div><div class="row"><input type="text" id="pname" maxlength="16" placeholder="e.g. Mr Jeff" style="flex:1;min-width:0;width:auto;margin:0"><button class="pbtn" id="pnameBtn">Save</button></div><div id="pmsg" style="font-size:.85rem;margin:6px 0;min-height:1em"></div><div class="sec">Top kids · refreshes every 3 min</div><div id="boardList"></div>';
  $('pname').value=S.pname||'';
  $('pnameBtn').onclick=async()=>{const m=await claimName($('pname').value);$('pmsg').textContent=m||'✅ Name saved! You are on the board.';if(!m)boardRefresh()};
  drawBoard();
}
setInterval(boardRefresh,180000);
(async()=>{
  try{
    if(!window.claude)return;
    DB=await window.claude.use('db');
    const u=await window.claude.use('user');myId=u?await u.id():null;if(!myId)DB=null;
  }catch(e){DB=null}
  boardRefresh();
})();

// ----- start -----
try{slot=+localStorage.getItem('kc_active')||1}catch(e){}
load();buildShop();buildQty();applyLook();render();scheduleBus();scheduleCandy();tickNews();
if(S.last){
  const s=Math.min((Date.now()-S.last)/1000,28800),g=kpsNow()*s*Math.min(1,.5+.1*S.u.night);
  if(s>60&&g>=1){S.kids+=g;S.total+=g;setTimeout(()=>toast('Welcome back! +'+fmt(g)+' kids while you were away'),500)}
}
if(S.name){$('modal').style.display='none';applyName()}else askName();
</script></body></html>
