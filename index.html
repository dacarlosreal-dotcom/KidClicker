<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kid Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#a1c4fd;--bg2:#c2e9fb;--panel:#fff;--text:#333;--sub:#666;--card:#f8f9fa;--border:#e9ecef;--accent:#ff7675;--green:#1e9e57;--glass:rgba(255,255,255,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b2a49;--bg2:#243b5e;--panel:#1e2433;--text:#eee;--sub:#aab;--card:#272e40;--border:#3a4259;--green:#4cd98a;--glass:rgba(0,0,0,.2)}}
:root[data-theme="dark"]{--bg1:#1b2a49;--bg2:#243b5e;--panel:#1e2433;--text:#eee;--sub:#aab;--card:#272e40;--border:#3a4259;--green:#4cd98a;--glass:rgba(0,0,0,.2)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);overflow:hidden}
#clickZone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--glass);position:relative;min-width:0}
h1{font-size:clamp(1.6rem,5vw,3rem);margin:0;text-align:center}
.name{font-size:1.1rem;color:var(--sub);margin-bottom:10px;text-align:center}
.name button{margin-left:8px;font-size:.75rem;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;padding:2px 8px}
.kps{color:var(--sub);margin:5px 0 15px;text-align:center}
#kidBtn{font-size:clamp(4rem,14vw,8rem);cursor:pointer;user-select:none;transition:transform .05s;filter:drop-shadow(0 10px 10px rgba(0,0,0,.15))}
#kidBtn:active{transform:scale(.9)}
#shop{width:360px;background:var(--panel);box-shadow:-5px 0 15px rgba(0,0,0,.1);display:flex;flex-direction:column;min-height:0}
#shop h2{background:var(--accent);color:#fff;text-align:center;padding:12px;margin:0;font-size:1.5rem}
#items{flex:1;overflow-y:auto;padding:12px}
.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:6px 0 8px}
.card{background:var(--card);border:2px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card.off{opacity:.5;cursor:not-allowed;transform:none}
.card h3{margin:0 0 3px;font-size:1rem}
.card p{margin:0;font-size:.8rem;color:var(--sub)}
.cost{font-weight:bold;color:var(--green);white-space:nowrap}
.cnt{background:var(--accent);color:#fff;padding:1px 8px;border-radius:20px;font-size:.75rem;margin-left:6px}
.float{position:absolute;color:var(--accent);font-weight:bold;font-size:1.4rem;pointer-events:none;animation:up .8s ease-out forwards;text-shadow:1px 1px 2px #fff}
@keyframes up{to{opacity:0;transform:translateY(-100px)}}
#bus{position:absolute;font-size:3.5rem;cursor:pointer;animation:bob 1s ease-in-out infinite;z-index:5}
@keyframes bob{50%{transform:translateY(-8px)}}
#dev{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:#222;color:#fff;border:2px solid gold;border-radius:10px;padding:10px;width:220px;font-size:.85rem;display:none}
#dev b{color:gold}
#dev input{width:100%;box-sizing:border-box;padding:5px;margin:6px 0;border-radius:5px;border:0}
#dev button{width:100%;margin-top:5px;padding:6px;border:0;border-radius:5px;cursor:pointer;background:gold;font-weight:bold}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
#modal div{background:var(--panel);padding:24px;border-radius:12px;text-align:center;width:min(90%,340px)}
#modal input{width:100%;box-sizing:border-box;padding:10px;font-size:1.1rem;margin:12px 0;border-radius:8px;border:2px solid var(--border);background:var(--card);color:var(--text)}
#modal button{padding:10px 24px;font-size:1rem;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#222;color:gold;padding:8px 16px;border-radius:20px;z-index:60;display:none;font-size:.9rem;text-align:center;max-width:90%}
.tools{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tools button{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px}
#grad{background:linear-gradient(90deg,#f6d365,#fda085);border:0;font-weight:bold;color:#333}
#grad:disabled{opacity:.5;cursor:not-allowed}
.ach{font-size:.8rem;color:var(--sub);padding:3px 0}.ach.got{color:var(--text);font-weight:600}
@media (max-width:700px){body{flex-direction:column}#shop{width:100%;height:50%;box-shadow:0 -5px 15px rgba(0,0,0,.1)}#clickZone{flex:1}}
/* ===== visual theme layer ===== */
:root{--sky1:#7cc8fb;--sky2:#d9f2ff;--grass1:#7ed957;--grass2:#4cbf56;--ink:#2b3a55;--shopbg:#fff8ec;--cardbg:#fff;--cardbd:#ffd9a8;--ok:#2fbf71;--hdr1:#ff8a65;--hdr2:#ff6f91}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#141c42;--sky2:#34457f;--grass1:#2f6b45;--grass2:#245536;--ink:#f1f3ff;--shopbg:#232a3f;--cardbg:#2d3550;--cardbd:#47507a;--ok:#4fd88f}}
:root[data-theme="dark"]{--sky1:#141c42;--sky2:#34457f;--grass1:#2f6b45;--grass2:#245536;--ink:#f1f3ff;--shopbg:#232a3f;--cardbg:#2d3550;--cardbd:#47507a;--ok:#4fd88f}
html,body,button,input{font-family:'Fredoka','Segoe UI',system-ui,sans-serif}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink)}
#clickZone{isolation:isolate;overflow:hidden;background:linear-gradient(to top,var(--grass2) 0,var(--grass1) 14px,var(--grass1) 64px,transparent 65px)}
#clickZone::before,#clickZone::after{content:'☁️';position:absolute;z-index:-1;font-size:5rem;opacity:.85;pointer-events:none;left:-15%;animation:drift 60s linear infinite}
#clickZone::before{top:6%}
#clickZone::after{top:26%;font-size:3.4rem;opacity:.6;animation-duration:90s;animation-delay:-45s}
@keyframes drift{to{left:110%}}
h1{color:#fff;font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.18),0 0 20px rgba(255,255,255,.55)}
.name{background:rgba(255,255,255,.85);color:#2b3a55;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.12);font-weight:600}
.kps{background:rgba(0,0,0,.2);color:#fff;padding:4px 14px;border-radius:999px;font-weight:600}
#kidBtn{display:grid;place-items:center;width:clamp(150px,30vw,230px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7d6,#ffd36b 60%,#ffb347);border:6px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.15),0 0 0 10px rgba(255,255,255,.35);font-size:clamp(4rem,14vw,7rem);filter:none;animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{translate:0 -8px}}
#kidBtn:hover{scale:1.04}
.tools button{border:0;background:#fff;color:#2b3a55;box-shadow:0 4px 0 rgba(0,0,0,.15);border-radius:12px;font-weight:600;padding:8px 14px}
.tools button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
#shop{background:var(--shopbg);border-left:6px solid #fff}
#shop h2{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:0 4px 0 rgba(0,0,0,.1);position:relative;z-index:1}
#shop h2::before{content:'🧸 '}
#items::-webkit-scrollbar{width:10px}
#items::-webkit-scrollbar-thumb{background:var(--cardbd);border-radius:10px}
.sec{color:var(--hdr2);font-weight:700;display:flex;align-items:center;gap:8px;margin:10px 0}
.sec::after{content:'';flex:1;height:3px;border-radius:3px;background:var(--cardbd)}
.card{background:var(--cardbg);color:var(--ink);border:3px solid var(--cardbd);border-radius:16px;box-shadow:0 4px 0 var(--cardbd)}
.card:not(.off){border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.card:hover{border-color:var(--hdr1)}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cardbd)}
.card.off{filter:grayscale(.5);opacity:.6}
.card h3{font-weight:600}
.card p{color:var(--ink);opacity:.7}
.cnt{background:var(--hdr2)}
.cost{background:var(--ok);color:#fff;padding:4px 12px;border-radius:999px;font-weight:700}
.cost::before{content:'👦 ';font-size:.8em}
.card.off .cost{background:#9aa3b5}
.ach{background:rgba(255,190,110,.18);border-radius:10px;padding:6px 10px;margin-bottom:5px;color:var(--ink);opacity:.75}
.ach.got{background:rgba(47,191,113,.2);opacity:1}
.float{color:#fff;text-shadow:-1px -1px 0 var(--hdr2),1px -1px 0 var(--hdr2),-1px 1px 0 var(--hdr2),1px 1px 0 var(--hdr2)}
#bus{filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#toast{background:linear-gradient(135deg,#ffd54f,#ffb300);color:#4a3200;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#modal div{background:var(--shopbg);color:var(--ink);border:6px solid #ffd36b;border-radius:24px}
#modal button{box-shadow:0 4px 0 rgba(0,0,0,.2);font-weight:600}
#dev{border-radius:16px;box-shadow:0 8px 0 rgba(0,0,0,.3)}
@media (max-width:700px){#shop{border-left:0;border-top:6px solid #fff}}
/* ===== settings, backgrounds, confetti ===== */
#setm{position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:55}
#setm>div{background:var(--shopbg);color:var(--ink);border:6px solid #ffd36b;border-radius:24px;padding:20px;width:min(92%,400px);max-height:85%;overflow-y:auto;box-sizing:border-box}
#setm h2{margin:0 0 6px;text-align:center}
#themeRow{display:flex;gap:6px;margin-bottom:8px}
#themeRow button,#setClose{flex:1;padding:8px;border:0;border-radius:12px;background:var(--cardbg);color:var(--ink);font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--cardbd)}
#themeRow .sel{background:var(--ok);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#setClose{width:100%;margin-top:6px;background:var(--hdr2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.cost.own::before{content:''}
.cost.own{background:var(--hdr1)}
.conf{position:fixed;top:-30px;z-index:70;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
#clickZone[data-bg=beach]{background:linear-gradient(to top,#f3d58a 0,#f3d58a 60px,#29a8e8 60px,#4fc3f7 110px,transparent 111px),linear-gradient(180deg,#8fdcff,#e9faff)}
#clickZone[data-bg=beach]::before{content:'☀️'}#clickZone[data-bg=beach]::after{content:'🕊️'}
#clickZone[data-bg=candy]{background:linear-gradient(to top,#ff8fc4 0,#ffb6d9 60px,transparent 61px),linear-gradient(180deg,#c9a7ff,#ffd6f0)}
#clickZone[data-bg=candy]::before{content:'🍭'}#clickZone[data-bg=candy]::after{content:'🍬'}
#clickZone[data-bg=space]{background:linear-gradient(to top,#5a5f73 0,#7b8199 50px,transparent 51px),radial-gradient(2px 2px at 20% 25%,#fff,transparent),radial-gradient(2px 2px at 75% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 55%,#fff,transparent),radial-gradient(2px 2px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 45%,#fff,transparent),linear-gradient(180deg,#0b1030,#2a1b5e)}
#clickZone[data-bg=space]::before{content:'🚀'}#clickZone[data-bg=space]::after{content:'🛸'}
#clickZone[data-bg=ocean]{background:linear-gradient(to top,#e8c98b 0,#e8c98b 40px,transparent 41px),linear-gradient(180deg,#4dd0e1,#0277bd)}
#clickZone[data-bg=ocean]::before{content:'🐠'}#clickZone[data-bg=ocean]::after{content:'🐙'}
#clickZone[data-bg=rainbow]{background:linear-gradient(to top,#b5ffb0 0,#b5ffb0 40px,transparent 41px),linear-gradient(180deg,#ff9a9e,#fecfef 35%,#a1c4fd 70%,#c2ffd8)}
#clickZone[data-bg=rainbow]::before{content:'🌈'}#clickZone[data-bg=rainbow]::after{content:'🦄'}
/* ===== polish pass 2 ===== */
#c-hands h3::before{content:'✊ '}#c-crayon h3::before{content:'🖍️ '}#c-teacher h3::before{content:'🍎 '}
#c-daycare h3::before{content:'🍼 '}#c-playground h3::before{content:'🛝 '}#c-school h3::before{content:'🏫 '}
#c-camp h3::before{content:'⛺ '}#c-park h3::before{content:'🎡 '}#c-town h3::before{content:'🏘️ '}
#c-city h3::before{content:'🏙️ '}#c-space h3::before{content:'🚀 '}#c-portal h3::before{content:'🌀 '}
#kidBtn{animation:idle 3s ease-in-out infinite,glow 2.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 10px 0 rgba(0,0,0,.15),0 0 0 14px rgba(255,255,255,.5),0 0 40px rgba(255,220,120,.8)}}
#shop h2{background:linear-gradient(90deg,var(--hdr1),var(--hdr2),var(--hdr1));background-size:200% 100%;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:200% 0}}
.card:not(.off){animation:ready 2.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 4px 0 var(--ok),0 0 14px var(--ok)}}
#setm{backdrop-filter:blur(4px);z-index:80}
#setm>div{animation:pop .25s ease-out;box-shadow:0 12px 0 rgba(0,0,0,.2)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#setm h2{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;margin:-20px -20px 12px;padding:14px;border-radius:16px 16px 0 0;text-shadow:0 2px 0 rgba(0,0,0,.2)}
#toast{z-index:90}
.conf{z-index:95}
#setm{z-index:1000}#toast{z-index:1010}.conf{z-index:1020}
#dev b{cursor:pointer;display:block}
@media (max-width:700px){#dev{width:150px;font-size:.75rem;padding:6px;left:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px))}#dev input{margin:3px 0;padding:3px}#dev button{margin-top:3px;padding:4px}}
/* ===== detailed backgrounds ===== */
#scene{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:space-around;align-items:flex-end;font-size:clamp(1.6rem,4vw,2.6rem);pointer-events:none;z-index:-1;white-space:nowrap}
#scene i{font-style:normal;animation:sway 4s ease-in-out infinite;transform-origin:bottom}
#scene i:nth-child(2n){animation-delay:-1.5s}#scene i:nth-child(3n){animation-delay:-2.7s}
@keyframes sway{50%{transform:rotate(4deg)}}
#clickZone[data-bg=meadow]{background:linear-gradient(to top,var(--grass2) 0,var(--grass2) 56px,transparent 57px),radial-gradient(ellipse 70% 110px at 20% 100%,var(--grass1) 98%,transparent 100%),radial-gradient(ellipse 60% 150px at 85% 100%,color-mix(in srgb,var(--grass1),#fff 15%) 98%,transparent 100%),radial-gradient(circle at 88% 12%,#fff6b0 0 26px,rgba(255,240,150,.5) 27px,transparent 110px),linear-gradient(180deg,var(--sky1),var(--sky2))}
#clickZone[data-bg=beach]{background:linear-gradient(to top,#f3d58a 0,#f3d58a 56px,transparent 57px),linear-gradient(to top,transparent 56px,#1e9ad6 57px,#37b6f0 85px,#5fd0f7 118px,transparent 119px),radial-gradient(ellipse 16% 30px at 78% calc(100% - 118px),#5b9a6a 98%,transparent 100%),radial-gradient(circle at 14% 14%,#fff3b0 0 28px,rgba(255,230,120,.5) 29px,transparent 110px),linear-gradient(180deg,#7fd3ff,#e9faff 75%)}
#clickZone[data-bg=candy]{background:repeating-linear-gradient(90deg,#ff7fba 0 24px,#ffb6d9 24px 48px) left bottom/100% 56px no-repeat,radial-gradient(ellipse 60% 120px at 15% 100%,#ffd0e8 98%,transparent 100%),radial-gradient(ellipse 55% 150px at 88% 100%,#c8f5e4 98%,transparent 100%),radial-gradient(3px 3px at 25% 20%,#fff,transparent),radial-gradient(3px 3px at 70% 35%,#fff,transparent),radial-gradient(3px 3px at 45% 12%,#fff,transparent),linear-gradient(180deg,#b79bff,#ffc8ec)}
#clickZone[data-bg=space]{background:linear-gradient(to top,#4b5066 0,#7b8199 50px,transparent 51px),radial-gradient(ellipse 50% 90px at 30% 100%,#8a90a8 98%,transparent 100%),radial-gradient(circle 60px at 82% 22%,#ff9966 0 62%,#d9643a 63% 90%,transparent 100%),radial-gradient(ellipse 40% 30% at 22% 35%,rgba(180,90,255,.35),transparent),radial-gradient(2px 2px at 20% 25%,#fff,transparent),radial-gradient(2px 2px at 75% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 55%,#fff,transparent),radial-gradient(2px 2px at 35% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 50%,#fff,transparent),linear-gradient(180deg,#0b1030,#2a1b5e)}
#clickZone[data-bg=ocean]{background:linear-gradient(to top,#e8c98b 0,#e8c98b 40px,transparent 41px),radial-gradient(ellipse 45% 70px at 20% 100%,#f1d9a0 98%,transparent 100%),radial-gradient(ellipse 40% 90px at 85% 100%,#dcb877 98%,transparent 100%),repeating-linear-gradient(100deg,rgba(255,255,255,.1) 0 40px,transparent 40px 95px),linear-gradient(180deg,#4dd0e1,#0277bd)}
#clickZone[data-bg=rainbow]{background:linear-gradient(to top,#b5ffb0 0,#b5ffb0 40px,transparent 41px),radial-gradient(ellipse 60% 110px at 20% 100%,#d3ffcf 98%,transparent 100%),radial-gradient(circle at 50% 118%,transparent 0 52%,#ff6b6b 52% 56%,#ffd93d 56% 60%,#6bcb77 60% 64%,#4d96ff 64% 68%,#b983ff 68% 72%,transparent 72%),linear-gradient(180deg,#ff9a9e,#fecfef 35%,#a1c4fd 70%,#c2ffd8)}
/* ===== wooden fence barrier around the shop ===== */
#shop{box-sizing:border-box;border:8px solid #a8672b;border-radius:18px;margin:10px 10px 10px 0;height:calc(100% - 20px);box-shadow:inset 0 0 0 4px #e0a96d,0 6px 0 rgba(0,0,0,.18);overflow:hidden}
#shop::before,#shop::after{content:'';display:block;flex:none;height:22px;background:linear-gradient(#a8672b,#a8672b) 0 13px/100% 4px no-repeat,repeating-linear-gradient(90deg,#e8b87a 0 12px,#c98d4f 12px 14px,transparent 14px 18px)}
@media (max-width:700px){#shop{width:auto;margin:0 8px 8px;height:50%;border-left:8px solid #a8672b;border-top:8px solid #a8672b}}
#dev b{cursor:grab;touch-action:none;user-select:none;font-size:1.3rem;text-align:center;line-height:1}
#dev b:active{cursor:grabbing}
#dev.min{width:auto!important;padding:6px 12px}
#setm>div{width:min(92%,440px)}
#setm h2{position:relative}
#setX{position:absolute;top:50%;right:12px;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#d63031;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);line-height:1;padding:0}
#setX:active{transform:translateY(-50%) scale(.92)}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#tabs button{flex:1 1 30%;padding:8px 4px;border:0;border-radius:12px;background:var(--cardbg);color:var(--ink);font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--cardbd);font-size:.85rem}
#tabs button.sel{background:var(--ok);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pane{display:none}.pane.on{display:block}
.vol{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600}
.vol input{flex:1;accent-color:var(--hdr2)}
#musToggle{width:100%;padding:8px;border:0;border-radius:12px;background:var(--hdr2);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-bottom:8px}
#dev{background:linear-gradient(160deg,#0b2a66,#123f8f);border:2px solid #5aa9ff;color:#e8f2ff;box-shadow:0 8px 0 rgba(0,20,60,.5),0 0 18px rgba(90,169,255,.5)}
#dev b{color:#9fd0ff}
#dev button{background:linear-gradient(#6db6ff,#2f7de1);color:#fff}
#dev input{background:#e8f2ff}
.bar{height:6px;border-radius:6px;background:rgba(0,0,0,.14);margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.card.slot{flex-wrap:wrap;cursor:default}.card.slot:hover{transform:none}
.srow{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.srow button,#pnameBtn,#autoBtn{padding:6px 12px;border:0;border-radius:10px;background:var(--hdr2);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#autoBtn{width:100%;padding:8px}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0;padding:8px;border-radius:10px;border:2px solid var(--cardbd);background:var(--cardbg);color:var(--ink);font-family:inherit}
#pmsg{font-size:.85rem;margin:6px 0;min-height:1em}
#c-sandbox h3::before{content:'🏖️ '}#c-library h3::before{content:'📚 '}#c-zoo h3::before{content:'🦒 '}#c-water h3::before{content:'🌊 '}#c-stadium h3::before{content:'🏟️ '}#c-moon h3::before{content:'🌕 '}#c-time h3::before{content:'⏳ '}#c-galaxy h3::before{content:'🌌 '}#c-multi h3::before{content:'♾️ '}#c-mega h3::before{content:'🧤 '}#c-snack h3::before{content:'🍪 '}
#kidBtn.tap{scale:.93}
</style>
</head>
<body>
<div id="clickZone">
  <div id="scene"></div>
  <div class="name"><span id="nameTxt"></span><button id="renameBtn">Rename</button></div>
  <h1 id="kids">0 Kids</h1>
  <div class="kps" id="kps"></div>
  <div id="kidBtn">👦</div>
  <div class="tools"><button id="grad">🎓 Graduate</button><button id="sndBtn">🔊</button><button id="musBtn">🎵 On</button><button id="setBtn">⚙️ Settings</button></div>

</div>
<div id="shop"><h2>The Nursery Shop</h2><div id="items"></div></div>

<div id="toast"></div>
<div id="setm" style="display:none"><div>
  <h2>⚙️ Settings<button id="setX" aria-label="Close settings">✕</button></h2>
  <div id="tabs"></div>
  <div class="pane" data-pane="bg"><div id="bgList"></div></div>
  <div class="pane" data-pane="kids"><div id="chList"></div></div>
  <div class="pane" data-pane="cursor"><div class="sec">Pick a cursor (all free)</div><div id="curList"></div></div>
  <div class="pane" data-pane="music">
    <button id="musToggle">🎵 Music: On</button>
    <div class="sec">Music style (all free)</div><div id="moodList"></div>
    <div class="sec">Volume</div>
    <label class="vol">🎵 Music <input type="range" id="mvol" min="0" max="1" step=".05"></label>
    <label class="vol">🔊 Effects <input type="range" id="svol" min="0" max="1" step=".05"></label>
  </div>
  <div class="pane" data-pane="ach"><div class="sec" id="achSum"></div><div id="achList"></div></div>
  <div class="pane" data-pane="board">
    <div class="sec">Your leaderboard name</div>
    <div class="row"><input id="pname" maxlength="16" placeholder="e.g. Mr Jeff"><button id="pnameBtn">Save</button></div>
    <div id="pmsg"></div>
    <div class="sec">Top kids · refreshes every 3 min</div><div id="boardList"></div>
  </div>
  <div class="pane" data-pane="saves"><div class="sec">3 save slots</div><div id="slotList"></div></div>
  <div class="pane" data-pane="theme"><div class="sec">Theme</div><div id="themeRow"></div><div class="sec">Auto clicker</div><button id="autoBtn">🤖 Auto clicker: OFF</button></div>
  <button id="setClose">Done</button>
</div></div>

<div id="dev">
  <b>🤫</b>
  <input id="devAmt" type="number" placeholder="Set kids to...">
  <button id="devSet">Set kids</button>
  <button id="devBuy">Buy everything +100 (costs kids)</button>
  <button id="devX2">Kids ×2</button>
  <button id="devMult">2× production: OFF</button>
</div>

<div id="modal"><div>
  <h2>🏫 Name your kindergarten</h2>
  <input id="nameIn" maxlength="24" placeholder="Sunshine Kindergarten">
  <button id="nameOk">Open the doors</button>
</div></div>

<script>
// ---------- data ----------
const BUILD=[
 {id:'daycare',n:'Baby Daycare',kps:.5,base:15},
 {id:'sandbox',n:'Sandbox',kps:1.2,base:50},
 {id:'playground',n:'Playground',kps:4,base:100},
 {id:'school',n:'Elementary School',kps:32,base:1100},
 {id:'library',n:'Story Library',kps:110,base:4500},
 {id:'camp',n:'Summer Camp',kps:200,base:12000},
 {id:'zoo',n:'Kid Zoo',kps:800,base:55000},
 {id:'park',n:'Theme Park',kps:1400,base:130000},
 {id:'water',n:'Water Park',kps:6000,base:6e5},
 {id:'town',n:'Kid Town',kps:8000,base:1.4e6},
 {id:'stadium',n:'Kid Stadium',kps:30000,base:6e6},
 {id:'city',n:'Kid City',kps:47000,base:2e7},
 {id:'moon',n:'Moon Base',kps:2e5,base:1e8},
 {id:'space',n:'Space Academy',kps:260000,base:3.3e8},
 {id:'portal',n:'Portal to Kid Dimension',kps:1.6e6,base:5.1e9},
 {id:'time',n:'Time Machine School',kps:1.2e7,base:7.5e10},
 {id:'galaxy',n:'Galaxy Campus',kps:9e7,base:1.2e12},
 {id:'multi',n:'Kid Multiverse',kps:6e8,base:2e13}
];
const UPG=[
 {id:'hands',n:'Stronger Hands',d:'+1 Kid per click',base:50,g:1.5},
 {id:'crayon',n:'Golden Crayons',d:'Clicks gain +1% of your Kids/sec',base:2000,g:2.2},
 {id:'teacher',n:'Teacher Training',d:'+10% to all Kids/sec',base:800,g:2.5},
 {id:'mega',n:'Giant Gloves',d:'+25 Kids per click',base:25000,g:1.7},
 {id:'snack',n:'Snack Time',d:'+5% to all Kids/sec',base:6000,g:3}
];
const S={name:'',kids:0,b:{},u:{},dip:0,total:0,bus:0,ach:{},snd:true,last:0,bgs:{meadow:1},bg:'meadow',theme:'auto',chars:{mix:1},ch:'mix',music:true,mood:'chill',mvol:.7,svol:.5,cur:'def',clicks:0,best:0,pname:'',auto:false};
BUILD.forEach(x=>S.b[x.id]=0);UPG.forEach(x=>S.u[x.id]=0);
const cost=(base,g,c)=>Math.floor(base*Math.pow(g,c));
const bCost=x=>cost(x.base,1.15,S.b[x.id]);
const uCost=x=>cost(x.base,x.g,S.u[x.id]);

const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  n=Math.floor(n);
  if(n<1000)return String(n);
  const i=Math.floor(Math.log10(n)/3);
  if(i>=SUF.length)return n.toExponential(2).replace('e+','e');
  return (n/Math.pow(1000,i)).toFixed(2).replace(/\.?0+$/,'')+SUF[i];
}
const A=(id,n,d,val,goal)=>({id,n,d,val,goal,ok:()=>val()>=goal});
const ACH=[
 ...[1e2,1e4,1e6,1e8,1e10,1e12,1e15].map(v=>A('t'+v,fmt(v)+' Club','Earn '+fmt(v)+' kids in one run',()=>S.total,v)),
 ...BUILD.map(x=>A('b'+x.id,x.n+' Pro','Own 10 '+x.n,()=>S.b[x.id],10)),
 ...[[1e2,'Warming Up'],[1e3,'Finger Workout'],[1e4,'Clicking Champion'],[1e5,'Click Machine'],[1e6,'Click Legend'],[1e7,'Click God']].map(([v,n])=>A('c'+v,n,'Click '+fmt(v)+' times',()=>S.clicks,v)),
 A('grad','Graduate!','Graduate once',()=>S.dip,1),
 A('dip10','Honor Roll','Earn 10 diplomas',()=>S.dip,10),
 A('bus','All Aboard','Catch a Field Trip bus',()=>S.bus,1),
 A('bus10','Bus Fan','Catch 10 buses',()=>S.bus,10),
 A('hands10','Strong Grip','Buy 10 Stronger Hands',()=>S.u.hands,10),
 A('allb','Full Campus','Own 1 of every building',()=>BUILD.filter(x=>S.b[x.id]>=1).length,BUILD.length),
 A('chars3','Dress-Up Day','Own 3 characters',()=>Object.keys(S.chars).length,3),
 A('chars8','Costume Party','Own every character',()=>Object.keys(S.chars).length,8),
 A('bgs3','Scenery Fan','Own 3 backgrounds',()=>Object.keys(S.bgs).length,3),
 A('bgs6','Interior Designer','Own every background',()=>Object.keys(S.bgs).length,6),
 A('kps1k','Busy Bees','Reach 1K kids per second',()=>kpsNow(),1e3),
 A('kps1m','Kid Factory','Reach 1M kids per second',()=>kpsNow(),1e6),
 A('kps1b','Kid Empire','Reach 1B kids per second',()=>kpsNow(),1e9)
];
let devMult=1;
const chMult=()=>CHARS.reduce((a,c)=>a*(S.chars[c.id]?c.m:1),1);
const gm=()=>(1+.1*S.u.teacher)*(1+.05*S.u.snack)*(1+.02*S.dip)*(1+.01*Object.keys(S.ach).length)*devMult*chMult();
const fd=n=>n<1000?String(+n.toFixed(1)):fmt(n);
const kpsNow=()=>BUILD.reduce((a,x)=>a+S.b[x.id]*x.kps,0)*gm();
const clickPow=()=>(1+S.u.hands+S.u.mega*25)*devMult*chMult()+S.u.crayon*.01*kpsNow();

// ---------- shop ----------
const $=id=>document.getElementById(id);
const items=$('items');
function card(id,title,desc){
  const el=document.createElement('div');el.className='card';el.id='c-'+id;
  el.innerHTML=`<div><h3>${title}<span class="cnt" id="n-${id}">0</span></h3><p>${desc}</p></div><div class="cost" id="p-${id}"></div>`;
  return el;
}
function buildShop(){
  items.innerHTML='<div class="sec">Upgrades</div>';
  UPG.forEach(x=>{const e=card(x.id,x.n,x.d);e.onclick=()=>buy('u',x);items.appendChild(e)});
  items.insertAdjacentHTML('beforeend','<div class="sec">Buildings</div>');
  BUILD.forEach(x=>{const e=card(x.id,x.n,`+${x.kps<1?x.kps:fmt(x.kps)} Kids per second`);e.onclick=()=>buy('b',x);items.appendChild(e)});
}
function buy(t,x){
  const c=t==='b'?bCost(x):uCost(x);
  if(S.kids<c)return;
  S.kids-=c;S[t][x.id]++;beep(700,.08);render();save();
}
function render(){
  const k=Math.floor(S.kids);
  $('kids').textContent=k===1?'1 Kid':fmt(k)+' Kids';
  $('kps').textContent=`per second: ${kpsNow()>=1000?fmt(kpsNow()):kpsNow().toFixed(1)}  ·  per click: ${clickPow()>=1000?fmt(clickPow()):clickPow().toFixed(1)}${S.auto?'  ·  🤖 auto +'+fd(clickPow()*33)+'/sec':''}`;
  document.title=fmt(k)+' Kids – '+S.name;
  const gmv=gm();
  BUILD.forEach(x=>{const e=$('c-'+x.id);if(e){const one=x.kps*gmv;e.querySelector('p').textContent=`+${fd(one)}/sec each · making ${fd(one*S.b[x.id])}/sec`}});
  ACH.forEach(a=>{
    if(!S.ach[a.id]&&a.ok()){S.ach[a.id]=1;toast('🏆 '+a.n+' unlocked!');beep(1000,.15);confetti(14)}
    const r=$('a-'+a.id);
    if(r){r.classList.toggle('got',!!S.ach[a.id]);r.textContent=(S.ach[a.id]?'✅ ':'🔒 ')+a.n+' – '+a.d}
  });
  const g=pending();$('grad').disabled=g<1;
  if(!gradArm)$('grad').textContent=`🎓 Graduate (+${g} 🏅, have ${S.dip})`;
  [['b',BUILD,bCost],['u',UPG,uCost]].forEach(([t,list,f])=>list.forEach(x=>{
    const c=f(x);
    $('p-'+x.id).textContent=fmt(c);
    $('n-'+x.id).textContent=S[t][x.id];
    $('c-'+x.id).classList.toggle('off',S.kids<c);
  }));
}

// ---------- clicking ----------
$('kidBtn').addEventListener('click',e=>{
  const p=clickPow();S.kids+=p;S.total+=p;S.clicks++;clickSound();if(S.ch==='mix')$('kidBtn').textContent=['👦','👧','🧒','👶'][Math.random()*4|0];render();
  const t=document.createElement('div');t.className='float';t.textContent='+'+fmt(Math.max(p,1));
  const r=$('clickZone').getBoundingClientRect();
  t.style.left=(e.clientX-r.left-15)+'px';t.style.top=(e.clientY-r.top-15)+'px';
  $('clickZone').appendChild(t);setTimeout(()=>t.remove(),800);
});
setInterval(()=>{const k=kpsNow();if(k>0){S.kids+=k/10;S.total+=k/10;render()}},100);

// ---------- field trip bus ----------
function scheduleBus(){setTimeout(spawnBus,45000+Math.random()*45000)}
function spawnBus(){
  const z=$('clickZone'),b=document.createElement('div');b.id='bus';b.textContent=BUS[S.bg]||'🚌';
  b.style.left=(10+Math.random()*70)+'%';b.style.top=(10+Math.random()*70)+'%';
  const gone=setTimeout(()=>{b.remove();scheduleBus()},10000);
  b.onclick=()=>{
    clearTimeout(gone);
    const bonus=Math.max(50,kpsNow()*60);S.kids+=bonus;S.total+=bonus;S.bus++;beep(900,.2);render();
    b.textContent='+'+fmt(bonus);b.style.fontSize='1.8rem';b.style.pointerEvents='none';
    setTimeout(()=>{b.remove();scheduleBus()},900);
  };
  z.appendChild(b);
}

// ---------- sound, toast, graduate ----------
let actx,gradArm=0,tt;
function beep(f,d){
  if(!S.snd)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle';o.frequency.value=f;g.gain.value=.04*sfv();
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3000)}
const pending=()=>Math.floor(Math.sqrt(S.total/1e7));
$('grad').onclick=()=>{
  if(pending()<1)return;
  if(!gradArm){gradArm=1;$('grad').textContent='Click again to confirm!';setTimeout(()=>{gradArm=0},3000);return}
  S.dip+=pending();S.kids=0;S.total=0;
  BUILD.forEach(x=>S.b[x.id]=0);UPG.forEach(x=>S.u[x.id]=0);
  gradArm=0;toast('🎓 Graduated! Each diploma gives +2% production');beep(900,.25);confetti(40);render();save();
};
$('sndBtn').onclick=()=>{S.snd=!S.snd;$('sndBtn').textContent=S.snd?'🔊':'🔇'};

// ---------- character sounds + chill music ----------
function ctx(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}
function tone(type,f0,f1,d,v,delay){
  const a=ctx(),t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(Math.max(v*sfv(),.0001),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,freq){
  const a=ctx(),b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  f.type='bandpass';f.frequency.value=freq;g.gain.value=v*sfv();
  s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}
function clickSound(){
  if(!S.snd)return;
  try{
    const r=Math.random();
    switch(S.ch){
      case 'hero':tone('sawtooth',300,900,.14,.05);break;
      case 'wizard':[880,1175,1568].forEach((f,i)=>tone('sine',f*(1+r*.05),f*1.02,.12,.07,i*.05));break;
      case 'ninja':noise(.09,.3,3500+r*1500);break;
      case 'astro':tone('sine',1300,420,.16,.08);break;
      case 'mermaid':tone('sine',400+r*200,1000+r*300,.09,.09);tone('sine',500+r*200,1200,.09,.07,.08);break;
      case 'unicorn':[1319,1760,2093].forEach((f,i)=>tone('sine',f,f*1.02,.14,.05,i*.04));break;
      case 'dragon':tone('sawtooth',150+r*30,55,.28,.07);noise(.2,.1,300);break;
      default:{const f=450+r*250;tone('triangle',f,f*1.01,.05,.05)}
    }
  }catch(e){}
}
const PROG=[[57,60,64,67],[53,57,60,64],[48,55,59,64],[55,59,62,64]];
const PENT=[69,72,74,76,79,81];
let mTimer=null,mStep=0,mGain=null;
const mf=n=>440*Math.pow(2,(n-69)/12);
let mOut=null;
function musicInit(){
  const a=ctx();if(mGain)return;
  mOut=a.createGain();mOut.gain.value=S.mvol*1.4;mOut.connect(a.destination);
  mGain=a.createGain();mGain.gain.value=.5;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
  const dl=a.createDelay(1),fb=a.createGain();dl.delayTime.value=.43;fb.gain.value=.35;
  dl.connect(fb);fb.connect(dl);
  mGain.connect(lp);lp.connect(mOut);lp.connect(dl);dl.connect(mOut);
}
function mNote(freq,t,d,v,type,atk){
  const o=actx.createOscillator(),g=actx.createGain(),a=atk||.08;
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,a+.05));
  o.connect(g);g.connect(mGain);o.start(t);o.stop(t+Math.max(d,a+.05)+.05);
}
function mDrum(t,kind){
  const a=actx;
  if(kind==='k'){
    const o=a.createOscillator(),g=a.createGain();
    o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
    g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g);g.connect(mOut);o.start(t);o.stop(t+.2);return;
  }
  const d=kind==='s'?.14:.04,b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);
  const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;g.gain.value=kind==='s'?.09:.05;
  src.buffer=b;src.connect(f);f.connect(g);g.connect(mOut);src.start(t);
}
const MOODS=[
 {id:'chill',n:'Chill Pads',e:'🌙',beat:.86,prog:PROG,mel:PENT,pad:'triangle',pv:.035,atk:.08,stag:0,mp:.55},
 {id:'lofi',n:'Lo-fi Beat',e:'☕',beat:.75,prog:[[50,57,60,65],[55,59,62,65],[48,55,59,64],[57,60,64,67]],mel:[62,65,67,69,72,74],pad:'triangle',pv:.04,atk:.05,stag:.02,mp:.4,drums:true},
 {id:'box',n:'Music Box',e:'🎁',beat:.5,prog:[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]],mel:[72,74,76,79,81,84],arp:true,mp:.25},
 {id:'piano',n:'Calm Piano',e:'🎹',beat:1,prog:[[48,55,64,67],[43,50,59,67],[45,52,60,64],[41,48,57,65]],mel:[72,74,76,79,81],pad:'sine',pv:.06,atk:.01,stag:.14,mp:.5,dec:2.5},
 {id:'dream',n:'Dreamy Clouds',e:'☁️',beat:1.2,prog:[[52,59,64,71],[48,55,64,67],[45,52,60,69],[43,50,59,66]],mel:[76,79,81,83,86],pad:'sine',pv:.045,atk:.9,stag:.05,mp:.35}
];
function musicStep(){
  if(!S.music||!actx||actx.state!=='running')return;
  const M=MOODS.find(m=>m.id===S.mood)||MOODS[0],t=actx.currentTime+.05,b=M.beat;
  const chord=M.prog[Math.floor(mStep/4)%M.prog.length],s=mStep%4;
  if(M.arp){
    const n=chord[mStep%chord.length];
    mNote(mf(n),t,b*3,.07,'sine',.01);mNote(mf(n+12),t,b*1.2,.03,'sine',.01);
    if(s===0)mNote(mf(chord[0]-12),t,b*3,.05,'sine');
  }else if(s===0){
    chord.forEach((n,i)=>mNote(mf(n),t+i*M.stag,M.dec||b*4,M.pv,M.pad,M.atk));
    mNote(mf(chord[0]-12),t,b*3.5,.06,'sine');
  }
  if(M.drums){mDrum(t,s%2===0?'k':'s');mDrum(t+b/2,'h')}
  if(Math.random()<M.mp)mNote(mf(M.mel[Math.random()*M.mel.length|0]),t+(Math.random()<.3?b/2:0),b*1.6,.04,'sine');
  mStep++;
}
function musicOn(){
  musicInit();if(mTimer)return;
  const M=MOODS.find(m=>m.id===S.mood)||MOODS[0];
  mTimer=setInterval(musicStep,Math.round(M.beat*1000));musicStep();
}
function musicOff(){clearInterval(mTimer);mTimer=null}
const sfv=()=>S.svol*2;
$('mvol').oninput=e=>{S.mvol=+e.target.value;if(mOut)mOut.gain.value=S.mvol*1.4;save()};
$('svol').oninput=e=>{S.svol=+e.target.value;save()};
$('svol').onchange=()=>{try{tone('triangle',700,720,.08,.08)}catch(err){}};
$('musToggle').onclick=()=>$('musBtn').click();

// ---------- cursors ----------
const CURS=[
 {id:'def',n:'Default',e:'🖱️',css:''},
 {id:'hand',n:'Pointing Hand',e:'👆',css:'pointer'},
 {id:'cross',n:'Crosshair',e:'➕',css:'crosshair'},
 {id:'apple',n:'Teacher Apple',e:'🍎',emoji:1},
 {id:'star',n:'Gold Star',e:'⭐',emoji:1},
 {id:'crayon',n:'Crayon',e:'🖍️',emoji:1},
 {id:'wand',n:'Magic Wand',e:'🪄',emoji:1},
 {id:'rocket',n:'Rocket',e:'🚀',emoji:1},
 {id:'lolly',n:'Lollipop',e:'🍭',emoji:1}
];
function cursorCss(c){
  if(c.emoji){
    const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text x='2' y='26' font-size='26'>${c.e}</text></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}") 6 6, auto`;
  }
  return c.css;
}
function applyCursor(){
  let st=document.getElementById('curStyle');
  if(!st){st=document.createElement('style');st.id='curStyle';document.head.appendChild(st)}
  const c=CURS.find(x=>x.id===S.cur)||CURS[0],css=cursorCss(c);
  st.textContent=css?`html,body,*{cursor:${css}!important}`:'';
}

  const l=$('curList');l.innerHTML='';

// ---------- name filter ----------
const BAD=['fuck','shit','bitch','cunt','dick','cock','pussy','nigg','slut','whore','bastard','nazi','hitler','penis','vagina','porn','boob','wank','twat','retard','piss','molest'];
const BADW=['ass','sex','tit','tits','cum','fag','kkk','rape','anal'];
function profane(t){
  const l=t.toLowerCase().replace(/[@4]/g,'a').replace(/3/g,'e').replace(/[1!|]/g,'i').replace(/0/g,'o').replace(/[$5]/g,'s');
  return BAD.some(w=>l.replace(/[^a-z]/g,'').includes(w))||l.split(/[^a-z]+/).some(w=>BADW.includes(w));
}
function badName(n){
  if(n.length<3||n.length>16)return 'Use 3–16 characters.';
  if(!/^[A-Za-z0-9][A-Za-z0-9 .'-]*$/.test(n))return 'Letters, numbers and spaces only.';
  if(profane(n))return 'Please pick a friendlier name.';
  return '';
}

// ---------- leaderboard (online page only) ----------
let DB=null,myId=null,BOARD=[];
const nkey=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'');
async function pushScore(){
  if(!DB||!myId||!S.pname)return;
  S.best=Math.max(S.best||0,S.total);
  await DB.collection('lb').doc(myId).set({name:S.pname,key:nkey(S.pname),kids:S.best,t:Date.now()});
}
async function claimName(raw){
  const name=raw.trim().replace(/\s+/g,' '),e=badName(name);
  if(e)return e;
  if(!DB||!myId)return 'The leaderboard only works on the online page.';
  try{
    const q=await DB.collection('lb').where('key','==',nkey(name)).get();
    if(q.docs.some(d=>d.id!==myId))return 'That name is already taken.';
    S.pname=name;await pushScore();save();return '';
  }catch(err){return 'Could not reach the leaderboard (you may need contributor access).'}
}
async function boardRefresh(){
  if(DB){try{await pushScore();const q=await DB.collection('lb').orderBy('kids','desc').limit(10).get();BOARD=q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){}}
  renderBoard();
}
function renderBoard(){
  const l=$('boardList');l.innerHTML='';
  if(!DB){l.textContent='The leaderboard works on the online page for signed-in viewers with contributor access.';return}
  if(!BOARD.length){l.textContent='No scores yet. Pick a name and keep clicking!';return}
  BOARD.forEach((r,i)=>{
    const el=document.createElement('div'),d=document.createElement('div'),h=document.createElement('h3'),c=document.createElement('div');
    el.className='card';h.textContent=(['🥇','🥈','🥉'][i]||'#'+(i+1))+' '+r.name+(r.id===myId?' (you)':'');
    c.className='cost own';c.textContent=fmt(r.kids);d.appendChild(h);el.append(d,c);l.appendChild(el);
  });
}
$('pnameBtn').onclick=async()=>{const m=await claimName($('pname').value);$('pmsg').textContent=m||'✅ Name saved! You are on the board.';if(!m)boardRefresh()};
setInterval(boardRefresh,180000);
(async()=>{
  try{
    if(!window.claude)return;
    DB=await window.claude.use('db');
    const u=await window.claude.use('user');
    myId=u?await u.id():null;if(!myId)DB=null;
  }catch(e){DB=null}
  boardRefresh();
})();

// ---------- 3 save slots ----------
const slotKey=n=>'kc_slot'+n;
let slot=1,armed='';
function freshState(){
  Object.assign(S,{name:'',kids:0,dip:0,total:0,bus:0,ach:{},last:0,bgs:{meadow:1},bg:'meadow',chars:{mix:1},ch:'mix',clicks:0,best:0,pname:'',auto:false});
  BUILD.forEach(x=>S.b[x.id]=0);UPG.forEach(x=>S.u[x.id]=0);
}
function switchSlot(n){
  save();slot=n;try{localStorage.setItem('kc_active',n)}catch(e){}
  freshState();load();applyLook();applyName();autoLabel();$('pname').value=S.pname||'';
  if(!S.name)askName();
}
function delSlot(n){
  try{localStorage.removeItem(slotKey(n))}catch(e){}
  if(n===slot){freshState();applyLook();applyName();autoLabel();askName()}
}
function renderSlots(){
  const l=$('slotList');l.innerHTML='';
  for(let n=1;n<=3;n++){
    let d=null;try{d=JSON.parse(localStorage.getItem(slotKey(n))||'null')}catch(e){}
    const cur=n===slot,info=cur?S:d,el=document.createElement('div'),row=document.createElement('div');
    el.className='card slot';row.className='srow';
    el.innerHTML=`<div><h3>💾 Save ${n}${cur?' · active':''}</h3><p>${info?esc(info.name||'Unnamed')+' · '+fmt(info.kids||0)+' kids':'Empty'}</p></div>`;
    const add=(label,fn,confirm)=>{
      const key=n+label,b=document.createElement('button');
      b.textContent=armed===key?'Sure?':label;
      b.onclick=e=>{e.stopPropagation();
        if(confirm&&armed!==key){armed=key;setTimeout(()=>{if(armed===key){armed='';renderSlots()}},3000);return renderSlots()}
        armed='';fn();renderSlots()};
      row.appendChild(b);
    };
    if(cur)add('Save now',()=>{save();toast('💾 Saved')});
    else{add(d?'Switch':'Start new',()=>switchSlot(n));add('Overwrite',()=>{try{localStorage.setItem(slotKey(n),JSON.stringify(S));toast('Copied to save '+n)}catch(e){}},true)}
    if(info)add('Delete',()=>delSlot(n),true);
    el.appendChild(row);l.appendChild(el);
  }
}

// ---------- save ----------
function save(){try{S.last=Date.now();localStorage.setItem(slotKey(slot),JSON.stringify(S))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot))||'null');
    if(d){S.name=d.name||'';S.kids=d.kids||0;
      S.dip=d.dip||0;S.total=d.total||0;S.bus=d.bus||0;S.ach=d.ach||{};S.snd=d.snd!==false;S.last=d.last||0;S.bgs=d.bgs||{meadow:1};S.bg=d.bg||'meadow';S.theme=d.theme||'auto';S.chars=d.chars||{mix:1};S.ch=d.ch||'mix';S.music=d.music!==false;S.mood=d.mood||'chill';S.mvol=d.mvol!=null?d.mvol:.7;S.svol=d.svol!=null?d.svol:.5;S.cur=d.cur||'def';S.clicks=d.clicks||0;S.best=d.best||0;S.pname=d.pname||'';S.auto=!!d.auto;
      BUILD.forEach(x=>S.b[x.id]=(d.b&&d.b[x.id])||0);
      UPG.forEach(x=>S.u[x.id]=(d.u&&d.u[x.id])||0);}
  }catch(e){}
}

function toggleDev(){$('dev').classList.toggle('min');[...$('dev').children].slice(1).forEach(e=>e.style.display=e.style.display==='none'?'':'none')}
(function(){
  const dev=$('dev'),h=dev.querySelector('b');
  let sx,sy,ox,oy,moved=false,down=false;
  h.addEventListener('pointerdown',e=>{
    const r=dev.getBoundingClientRect();
    down=true;moved=false;sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener('pointermove',e=>{
    if(!down)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)<5)return;
    moved=true;
    const x=Math.max(0,Math.min(innerWidth-dev.offsetWidth,ox+dx));
    const y=Math.max(0,Math.min(innerHeight-dev.offsetHeight,oy+dy));
    dev.style.left=x+'px';dev.style.top=y+'px';dev.style.bottom='auto';
  });
  h.addEventListener('pointerup',()=>{down=false;if(!moved)toggleDev()});
  h.addEventListener('pointercancel',()=>{down=false});
})();
if(innerWidth<=700)toggleDev();
if(S.last){
  const s=Math.min((Date.now()-S.last)/1000,28800),g=kpsNow()*s*.5;
  if(s>60&&g>=1){S.kids+=g;S.total+=g;setTimeout(()=>toast('Welcome back! +'+fmt(g)+' kids while you were away'),500)}
}
if(S.name){$('modal').style.display='none';applyName()}else{askName()}
